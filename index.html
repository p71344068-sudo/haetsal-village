<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>햇살 마을</title>
<meta name="description" content="합성 퍼즐로 에너지를 모아 3D 섬 마을을 짓는 게임">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="햇살 마을">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#3ab0e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@500;700;800&display=swap">
<style>
/* Layout: one phone-shaped game column (max 480px) with two scenes — a 3D isometric island village (Three.js, pan/zoom) and the merge board. Single sunny visual world with its own day/night cycle. */
:root{
  --sea:#3ab0e8;
  --wood:#8a5a36;
  --panel:#fffaf0;
  --panel-edge:#e9d6b4;
  --ink:#3b2a1c;
  --ink-soft:#7a6450;
  --cell:#dbeefb;
  --cell-edge:#bcd9ef;
  --board:#a9d3f2;
  --energy:#ffcf2e;
  --energy-deep:#f39c12;
  --go:#4cc37a;
  --go-deep:#2d9a58;
  --alert:#ef5a5a;
  --craft:#a77bf3;
  --craft-soft:#efe4ff;
  --hud:rgba(40,30,22,.55);
  --display:"Jua","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:#2f8fc4;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--sea);box-shadow:0 0 40px rgba(0,0,0,.25)}
.emo{font-family:var(--emoji);line-height:1}

/* ---------- HUD ---------- */
.hud{position:absolute;inset:0 0 auto;z-index:30;display:flex;align-items:center;gap:6px;padding:10px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));pointer-events:none}
.hud>*{pointer-events:auto}
.lvl{position:relative;width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--energy) var(--p,0%),#6b4a2e 0);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.lvl b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffe9b0,#e7a94a);font-family:var(--display);font-size:19px;color:#5a3412}
.pill{display:flex;align-items:center;gap:5px;height:32px;padding:0 10px 0 3px;border-radius:16px;background:var(--hud);color:#fff;font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums;min-width:0}
.pill .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:16px}
.pill.en .ic{background:linear-gradient(#fff07a,var(--energy-deep))}
.pill.co .ic{background:linear-gradient(#fff3a6,#e8a11a)}
.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.18)}}
.hud .grow{flex:1}
.hbtn{position:relative;width:36px;height:36px;flex:none;border-radius:11px;background:var(--hud);color:#fff;font-size:18px;display:grid;place-items:center}
.hbtn .n{position:absolute;right:-5px;top:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--craft);font-family:var(--display);font-size:12px;display:grid;place-items:center;border:2px solid #fff}
.hbtn.glow{background:#f39c12;animation:bump 1.2s infinite}

/* ---------- Scenes ---------- */
.scene{position:absolute;inset:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
.scene.off{opacity:0;pointer-events:none;transform:scale(.97)}

/* ---------- 3D village ---------- */
#map{background:var(--sea)}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.lab{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:3px;will-change:transform}
.lab .nm{padding:2px 8px;border-radius:9px;background:rgba(255,250,240,.93);font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.lab.lm .nm{background:linear-gradient(#fff4cf,#ffe39a);box-shadow:0 2px 0 #d7a43b}
.lab .st{color:#f0a500;letter-spacing:1px}
.far .lab .nm{display:none}
.bub{pointer-events:auto;position:relative;display:flex;align-items:center;gap:3px;padding:4px 9px;border-radius:14px;background:#fff;font-family:var(--display);font-size:14px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.bub.ready{background:var(--go);color:#fff;animation:hop 1.2s ease-in-out infinite}
.bub.ready::after{border-top-color:var(--go)}
.bub.collect{background:#fff6c4;font-size:22px;padding:4px 8px;animation:hop 1s ease-in-out infinite;box-shadow:0 3px 0 #e0b84a,0 0 0 3px #fff}
.bub.collect::after{border-top-color:#fff6c4}
.bub.plus{width:32px;height:32px;padding:0;justify-content:center;border-radius:50%;background:rgba(255,255,255,.92);color:var(--go-deep);font-size:22px}
.bub.plus::after{display:none}
@keyframes hop{50%{transform:translateY(-6px)}}
.lockcard{position:absolute;left:0;top:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 16px;border-radius:18px;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15);text-align:center;min-width:200px}
.lockcard .emo{font-size:28px}
.lockcard b{font-family:var(--display);font-size:18px;font-weight:400}
.lockcard ul{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:12px;font-weight:700;color:var(--ink-soft);text-align:left}
.lockcard .open{margin-top:4px;padding:8px 18px;border-radius:12px;background:var(--go);color:#fff;font-family:var(--display);font-size:16px;box-shadow:0 4px 0 var(--go-deep);animation:hop2 1.2s ease-in-out infinite}
.lockcard.small{min-width:0;padding:6px 12px;gap:2px}
.lockcard.small b{font-size:15px}
@keyframes hop2{50%{transform:translateY(-3px)}}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}

.goal{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:62px;z-index:20;max-width:66%;padding:8px 12px;border-radius:12px;background:var(--panel);box-shadow:0 3px 0 var(--panel-edge);font-size:12px;font-weight:800;text-align:left}
.goal b{display:block;font-family:var(--display);font-weight:400;font-size:15px;color:var(--wood)}
.goal .row{display:flex;gap:10px;margin-top:3px;color:var(--ink-soft)}
.goal .ok{color:var(--go-deep)}
.goal .stats{display:flex;gap:10px;margin-top:5px;padding-top:5px;border-top:1px dashed var(--panel-edge);font-family:var(--display);font-weight:400;font-size:14px}
.zoombar{position:absolute;z-index:20;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.zoombar button{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.92);font-family:var(--display);font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.2)}

.fab{position:absolute;z-index:25;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:2px}
.fab .btn{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:radial-gradient(circle at 35% 30%,#7ee3a2,var(--go) 60%,var(--go-deep));border:4px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.fab .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.fab span{padding:2px 9px;border-radius:9px;background:#fff;font-family:var(--display);font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.fab.alt .btn{background:radial-gradient(circle at 35% 30%,#9fdcff,#3d9be0 60%,#2271b3)}
.fab .dot{position:absolute;top:0;right:0;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--alert);color:#fff;font-family:var(--display);font-size:13px;display:grid;place-items:center;border:2px solid #fff}

/* ---------- Merge scene ---------- */
#merge{display:flex;flex-direction:column;background:linear-gradient(#ffd9a8,#f7b57a 118px,#c96c4a 119px,#b25a3c);padding-top:62px}
.orders{display:flex;gap:7px;padding:10px max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px));overflow-x:auto;scrollbar-width:none;flex:none}
.orders::-webkit-scrollbar{display:none}
.order{position:relative;flex:1 0 0;min-width:100px;padding:6px 5px 6px;border-radius:14px;background:var(--panel);box-shadow:0 4px 0 var(--panel-edge);display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .3s,opacity .3s}
.order .who{position:absolute;left:-2px;top:-8px;width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:18px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.order .sw{position:absolute;right:-3px;top:-8px;width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--ink-soft);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.order .name{align-self:center;font-size:11px;font-weight:800;color:var(--ink-soft);white-space:nowrap}
.order .reqs{display:flex;gap:3px}
.req{position:relative;width:34px;height:34px;border-radius:9px;background:#f0e4cf;display:grid;place-items:center;font-size:22px}
.req.mat{background:var(--craft-soft);box-shadow:inset 0 0 0 2px #cdb3fb}
.req.have{background:#d4f5d8;box-shadow:none}
.req.have::after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:15px;height:15px;border-radius:50%;background:var(--go);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;font-family:var(--body)}
.order .rw{font-family:var(--display);font-size:13px;color:var(--ink-soft);white-space:nowrap}
.order button.ok{width:100%;padding:5px 0 6px;border-radius:9px;background:#d9ccb6;color:#fff;font-family:var(--display);font-size:14px;pointer-events:none}
.order.ready{box-shadow:0 4px 0 var(--go-deep),0 0 0 3px var(--go);animation:glow 1.3s ease-in-out infinite}
.order.ready button.ok{background:var(--go);pointer-events:auto}
.order.express{background:linear-gradient(#fff3f0,#ffe4dc);box-shadow:0 4px 0 #f0b4a4,0 0 0 2px #ff8a65}
.order.express.ready{box-shadow:0 4px 0 var(--go-deep),0 0 0 3px var(--go)}
.order .tmr{font-family:var(--display);font-size:12px;color:#e8582a;font-variant-numeric:tabular-nums}
.order.hint{animation:hintO .8s ease-in-out infinite}
@keyframes glow{50%{transform:translateY(-3px)}}
@keyframes hintO{50%{transform:scale(1.06)}}
.order.leaving{transform:translateY(-30px) scale(.8);opacity:0}

.boardwrap{flex:1;min-height:0;display:grid;place-items:center;padding:0 8px;overflow:hidden}
.board{display:grid;gap:3px;padding:6px;border-radius:16px;background:var(--board);box-shadow:inset 0 0 0 3px #8fc0e6,0 6px 0 rgba(0,0,0,.2);touch-action:none}
.cell{position:relative;border-radius:9px;background:var(--cell);box-shadow:inset 0 -3px 0 var(--cell-edge);display:grid;place-items:center;transition:transform .12s}
.cell .it{font-size:calc(var(--cs) * .6);filter:drop-shadow(0 2px 1px rgba(0,0,0,.18))}
.cell.sel{box-shadow:inset 0 0 0 3px #fff,0 0 0 3px #3b8fd8}
.cell.match{background:#fff6c4;box-shadow:inset 0 0 0 3px var(--energy)}
.cell.combo{background:var(--craft-soft);box-shadow:inset 0 0 0 3px var(--craft)}
.cell.hover{transform:scale(1.08);background:#fff}
.cell.src .it{opacity:.25}
.cell.hint{animation:hintC .8s ease-in-out infinite;z-index:2}
@keyframes hintC{50%{transform:scale(1.1);box-shadow:0 0 0 3px #fff,0 0 16px 5px #ffe066}}
.cell.gen{background:radial-gradient(circle at 50% 40%,#fff5cf,#ffd77a);box-shadow:inset 0 -3px 0 #e6b24a}
.cell.gen.lv2{background:radial-gradient(circle at 50% 40%,#fff,#ffc04d);box-shadow:inset 0 -3px 0 #e08f1a,inset 0 0 0 2px #fff}
.cell.gen.lv3{background:radial-gradient(circle at 50% 40%,#fff,#ff9fd0 50%,#c58cff);box-shadow:inset 0 -3px 0 #9a5bd8,inset 0 0 0 2px #fff}
.cell.gen.empty{filter:saturate(.3)}
.cell .gl{position:absolute;left:3px;top:2px;font-family:var(--display);font-size:10px;color:#a0661a}
.cell .ch{position:absolute;right:2px;bottom:2px;min-width:17px;height:15px;padding:0 4px;border-radius:8px;background:#5b3b1f;color:#fff;font-family:var(--display);font-size:11px;display:grid;place-items:center}
.cell .rc{position:absolute;left:12px;right:5px;top:4px;height:4px;border-radius:2px;background:rgba(0,0,0,.15);overflow:hidden}
.cell .rc i{display:block;height:100%;background:var(--go)}
.cell .lv{position:absolute;left:3px;bottom:2px;font-family:var(--display);font-size:10px;color:#5c86a8}
.cell.top .lv{color:#d38a00}
.cell.chest{background:radial-gradient(circle at 50% 40%,#fff,#ffd9ec)}
.cell.joker{background:conic-gradient(from 0deg,#ffd6d6,#fff3c4,#d6ffd9,#d6ecff,#ecd6ff,#ffd6d6)}
.cell.web .it{filter:saturate(.55) brightness(.95)}
.cell.web::after{content:"";position:absolute;inset:0;border-radius:9px;background:repeating-linear-gradient(45deg,rgba(70,140,55,.38) 0 3px,transparent 3px 9px),repeating-linear-gradient(-45deg,rgba(70,140,55,.3) 0 3px,transparent 3px 11px);box-shadow:inset 0 0 0 2px #5d9b48;pointer-events:none}
.cell.fog{background:linear-gradient(#f3f6fa,#cfd9e6);box-shadow:inset 0 -3px 0 #b5c3d4}
.cell.fog .it{font-size:calc(var(--cs) * .5);opacity:.75;filter:none}
.cell.pop .it{animation:pop .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.cell.spawn .it{animation:pop .3s ease-out}
.cell.reveal{animation:reveal .6s ease-out}
@keyframes reveal{0%{transform:scale(.6) rotate(-8deg);filter:brightness(2)}100%{transform:none}}
.cell.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.combo-pop{position:absolute;z-index:75;pointer-events:none;font-family:var(--display);font-size:22px;color:#fff;text-shadow:0 2px 0 #c0392b,0 0 6px rgba(0,0,0,.3);animation:cpop 1s ease-out forwards;white-space:nowrap}
@keyframes cpop{0%{transform:translate(-50%,0) scale(.5);opacity:0}20%{transform:translate(-50%,-10px) scale(1.2);opacity:1}100%{transform:translate(-50%,-50px) scale(1);opacity:0}}
.finger{position:absolute;left:0;top:0;z-index:85;font-size:38px;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));font-family:var(--emoji)}

.mbar{position:relative;z-index:3;flex:none;display:flex;gap:8px;margin:10px 92px 0 max(10px,env(safe-area-inset-left,0px));height:86px}
.bagbtn{position:relative;width:54px;flex:none;border-radius:14px;background:var(--panel);box-shadow:0 4px 0 var(--panel-edge);font-size:28px;display:grid;place-items:center;transition:transform .12s}
.bagbtn.hover{background:#fff6c4;transform:scale(1.1);box-shadow:0 4px 0 var(--energy-deep),0 0 0 3px var(--energy)}
.bagbtn b{position:absolute;right:-4px;top:-6px;min-width:20px;height:18px;padding:0 4px;border-radius:9px;background:#5b3b1f;color:#fff;font-family:var(--display);font-size:11px;display:grid;place-items:center}
.info{flex:1;min-width:0;height:100%;overflow:hidden;display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:14px;background:var(--panel);box-shadow:0 4px 0 var(--panel-edge)}
.info .big{width:38px;height:38px;flex:none;border-radius:11px;background:var(--cell);display:grid;place-items:center;font-size:24px}
.info .txt{flex:1;min-width:0}
.info .t1{font-family:var(--display);font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .t1 small{font-size:12px;color:var(--ink-soft)}
.info .t2{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-top:2px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info .t2 .cr{color:var(--craft);font-weight:800}
.chain{display:flex;gap:2px;margin-top:3px;flex-wrap:nowrap;overflow:hidden}
.chain span{flex:none;font-size:12px;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:#f2e8d6}
.chain span.cur{background:#ffe27a;box-shadow:0 0 0 2px var(--energy-deep)}
.chain span.unk{font-family:var(--display);font-size:11px;color:#b8a78f}
.act{flex:none;padding:7px 8px;border-radius:10px;background:var(--energy);font-family:var(--display);font-size:13px;box-shadow:0 3px 0 var(--energy-deep);white-space:nowrap}
.act:active{transform:translateY(2px);box-shadow:0 1px 0 var(--energy-deep)}
.act:disabled{opacity:.45}
.mergebottom{flex:none;height:calc(22px + env(safe-area-inset-bottom,0px))}

/* ---------- Sheet / modal ---------- */
.shade{position:absolute;inset:0;z-index:50;background:rgba(30,20,10,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.shade.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-height:84%;overflow-y:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-radius:24px 24px 0 0;background:var(--panel);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.shade.on .sheet{transform:none}
.shade.center{align-items:center;padding:20px}
.shade.center .sheet{border-radius:22px;transform:scale(.9);max-width:400px;padding-bottom:20px}
.shade.center.on .sheet{transform:none}
.sh-head{display:flex;gap:14px;align-items:center}
.sh-head .pic{position:relative;width:84px;height:84px;flex:none;border-radius:20px;background:linear-gradient(#c9ecff,#a8e08a);display:grid;place-items:center;font-size:52px}
.sh-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:23px;text-wrap:balance}
.sh-head p{margin:4px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.45}
.stages{display:flex;gap:6px;margin:14px 0 6px}
.stages i{flex:1;height:10px;border-radius:5px;background:#eadcc4}
.stages i.on{background:linear-gradient(90deg,var(--energy),var(--energy-deep))}
.stlabel{font-size:12px;font-weight:800;color:var(--ink-soft)}
.costs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:10px;background:#eef8e6;font-family:var(--display);font-size:14px;color:var(--go-deep)}
.chip.no{background:#fde8e8;color:#c0392b}
.perk{margin-top:12px;padding:10px 12px;border-radius:12px;background:#eef8e6;font-size:13px;font-weight:700;line-height:1.45}
.perk.unlock{background:#fff1c9}
.big-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:13px 0;border-radius:16px;font-family:var(--display);font-size:19px;color:#fff;background:var(--go);box-shadow:0 5px 0 var(--go-deep)}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--go-deep)}
.big-btn.blue{background:#3d9be0;box-shadow:0 5px 0 #2271b3}
.big-btn.ghost{background:#eadcc4;color:var(--ink);box-shadow:0 5px 0 #d3c09e}
.big-btn.red{background:var(--alert);box-shadow:0 5px 0 #b83c3c}
.big-btn:disabled{opacity:.5}
.need{margin-top:8px;text-align:center;font-size:13px;font-weight:700;color:var(--alert)}
.cat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px 9px;border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--panel-edge);text-align:center}
.card .ce{font-size:36px}
.card b{font-family:var(--display);font-weight:400;font-size:16px}
.card small{font-size:12px;font-weight:800;color:var(--ink-soft)}
.card .costs{justify-content:center;margin-top:3px}
.card .chip{font-size:12px;padding:2px 6px}
.card.poor{opacity:.75}
.card.locked{opacity:.5}
.card .lk{position:absolute;right:6px;top:6px;padding:1px 6px;border-radius:7px;background:#5b3b1f;color:#fff;font-family:var(--display);font-size:11px}
.inv{display:grid;gap:8px;margin-top:12px}
.inv .row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#fff;box-shadow:0 2px 0 var(--panel-edge)}
.inv .row .ie{width:40px;height:40px;flex:none;border-radius:10px;background:var(--craft-soft);display:grid;place-items:center;font-size:24px}
.inv .row .nm{flex:1;min-width:0;font-size:13px;font-weight:800}
.inv .row .nm span{display:block;font-weight:700;color:var(--ink-soft);font-size:12px;margin-top:2px}
.inv .row .cnt{font-family:var(--display);font-size:20px;color:var(--craft)}
.inv .row.lockd{opacity:.5}
.bagg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.bagg button{aspect-ratio:1;border-radius:14px;background:var(--cell);font-size:32px;box-shadow:inset 0 -3px 0 var(--cell-edge);display:grid;place-items:center}
.bagg button.empty{background:#efe6d6;box-shadow:inset 0 0 0 2px #e0d2b8;font-size:14px;color:#b8a78f;font-family:var(--display)}
.steps{display:grid;gap:9px;margin:14px 0 4px;padding:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:center;font-size:13.5px;font-weight:700;line-height:1.4}
.steps li .emo{width:42px;height:42px;flex:none;border-radius:12px;background:#f2e8d6;display:grid;place-items:center;font-size:23px}
.title-big{margin:0;text-align:center;font-family:var(--display);font-weight:400;font-size:25px}
.sub{margin:6px 0 0;text-align:center;font-size:13px;color:var(--ink-soft);font-weight:700}
.dex{display:grid;gap:6px;margin-top:12px}
.dex .row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:12px;background:#fff;box-shadow:0 2px 0 var(--panel-edge)}
.dex .row b{width:62px;flex:none;font-family:var(--display);font-weight:400;font-size:14px}
.dex .row span{font-size:19px;width:24px;text-align:center}
.dex .row span.unk{font-family:var(--display);font-size:13px;color:#c7b8a0}
.dex .row.lockd{opacity:.45}

/* ---------- FX ---------- */
.toast{position:absolute;left:50%;top:74px;z-index:60;transform:translate(-50%,-20px);padding:10px 16px;border-radius:14px;background:rgba(40,28,18,.9);color:#fff;font-size:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fly{position:absolute;z-index:70;pointer-events:none;font-family:var(--emoji);transition:transform .7s cubic-bezier(.5,-0.3,.6,1),opacity .7s}
.ghost{position:absolute;z-index:80;pointer-events:none;display:grid;place-items:center;font-family:var(--emoji);filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
.burst{position:absolute;z-index:65;pointer-events:none;font-family:var(--emoji);font-size:22px;animation:burst 1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.fxc{position:absolute;inset:0;z-index:66;pointer-events:none}
.lvup{position:absolute;inset:0;z-index:90;display:grid;place-items:center;pointer-events:none}
.lvup div{padding:18px 28px;border-radius:22px;background:var(--panel);text-align:center;box-shadow:0 8px 0 var(--panel-edge);animation:lv 2.4s forwards}
.lvup b{display:block;font-family:var(--display);font-weight:400;font-size:30px;color:var(--energy-deep)}
.lvup span{font-size:13px;font-weight:700;color:var(--ink-soft)}
@keyframes lv{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.08);opacity:1}25%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#2f8fc4;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;height:100%;font-size:14px;overscroll-behavior:none;-webkit-touch-callout:none;touch-action:manipulation}

  const el=V.renderer.domElement;const pts=new Map();let moved=false,startDist=0,startZoom=1,down=null;

    segs.push({a:[sx*1.75,zz-12],b:[sx*1.75,zz+12]},{a:[x-12,sz*1.75],b:[x+12,sz*1.75]});

const SHIRTS=['#e8483f','#3d8fd6','#f2c94c','#4cc37a','#ff7aa8','#c58cff','#ff9f43','#ffffff'],HAIRS=['#3b2a1c','#7a4a2a','#f2c94c','#222222','#b5694f'];
function syncWalkers(){

  while(V.walkers.length<want){const m=person(pick(SHIRTS),pick(HAIRS));V.scene.add(m);const w={m,seg:pick(segs),p:Math.random(),tp:Math.random(),wait:Math.random()*3,sp:.04+Math.random()*.03};V.walkers.push(w)}
  while(V.walkers.length>want){const w=V.walkers.pop();V.scene.remove(w.m)}

function stepWalkers(t,dt){
  V.walkers.forEach(w=>{const s=w.seg;const L=Math.hypot(s.b[0]-s.a[0],s.b[1]-s.a[1]);
    if(w.wait>0){w.wait-=dt}else{const d=w.tp-w.p,step=w.sp*dt*30/L;if(Math.abs(d)<=step){w.p=w.tp;w.wait=1+Math.random()*4;w.tp=Math.random();if(Math.random()<.2)w.seg=pick(V.segs)}else w.p+=Math.sign(d)*step}
    const x=s.a[0]+(s.b[0]-s.a[0])*w.p,z=s.a[1]+(s.b[1]-s.a[1])*w.p;w.m.position.set(x,.3+(w.wait>0?0:Math.abs(Math.sin(t*9+x))*.08),z);
    const dir=Math.sign(w.tp-w.p);w.m.rotation.y=Math.atan2((s.b[0]-s.a[0])*dir,(s.b[1]-s.a[1])*dir)});
  V.cars.forEach(c=>{c.p+=c.sp*dt*c.dir;if(c.p>32)c.p=-32;if(c.p<-32)c.p=32;if(c.ax===0){c.m.position.set(c.lane,.2,c.p);c.m.rotation.y=c.dir>0?-Math.PI/2:Math.PI/2}else{c.m.position.set(c.p,.2,c.lane);c.m.rotation.y=c.dir>0?0:Math.PI}});
}
function applyTime(){
  if(!V)return;const n=isNight();V.night=n;
  V.hemi.intensity=n?.5:.72;V.hemi.color.set(n?'#8fa3ff':'#ffffff');V.sun.intensity=n?.26:.78;V.sun.color.set(n?'#9fb4ff':'#fff0d0');
  WINM().emissive.set(n?'#ffc860':'#000000');LAMPM().emissive.set(n?'#ffd27a':'#000000');
  V.scene.background.set(n?'#1b3b6b':'#3ab0e8');V.sea.material.color.set(n?'#1d4f86':'#38aee6');$('map').style.background=n?'#1b3b6b':'';
}
let lastF=performance.now(),seaT=0;
function loop3D(now){
  requestAnimationFrame(loop3D);
  const dt=Math.min(.1,(now-lastF)/1000);lastF=now;const t=now/1000;
  for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];const p=Math.min(1,(now-w.t0)/w.dur);w.fn(p);if(p>=1){tweens.splice(i,1);w.done&&w.done()}}
  if(!V||S.scene!=='map')return;
  V.tickers.forEach(f=>f(t,dt));
  for(const id in V.slots){const tk=V.slots[id].g.userData.tickers;for(let i=0;i<tk.length;i++)tk[i](t,dt)}
  V.deco.traverse(o=>{if(o.userData.tick)o.userData.tick.forEach(f=>f(t))});
  stepWalkers(t,dt);
  if((seaT+=dt)>.05){seaT=0;const pos=V.sea.geometry.attributes.position,b=V.seaBase;for(let i=0;i<pos.count;i++){const x=b[i*3],z=b[i*3+2];pos.array[i*3+1]=Math.sin(x*.35+t*1.3)*.12+Math.cos(z*.3+t)*.1}pos.needsUpdate=true;V.sea.geometry.computeVertexNormals()}
  V.renderer.render(V.scene,V.cam);positionLabels();
}

function emojiOf(v){return v.k==='i'?item(v.c,v.l)[0]:v.k==='g'?GENS[v.g].emoji:v.k==='c'?CHEST.emo[v.l-1]:'🌈'}
function nameOf(v){return v.k==='i'?item(v.c,v.l)[1]:v.k==='g'?GENS[v.g].name:v.k==='c'?CHEST.name[v.l-1]:'무지개 별'}
function cellHtml(v){
  if(!v||v.__reserved)return '';
  if(v.lock===2)return `<span class="it emo">☁️</span>`;
  if(v.k==='g'){const mx=GEN_MAX[v.lv-1];const pct=v.ch>=mx?0:Math.min(100,(Date.now()-v.t)/GENS[v.g].rate*100);
    return `<span class="it emo">${GENS[v.g].emoji}</span><span class="gl">Lv${v.lv}</span><span class="ch">${v.ch}</span>${v.ch<mx&&!v.lock?`<span class="rc"><i style="width:${pct}%"></i></span>`:''}`}

  if(v.k==='j')return `<span class="it emo">🌈</span>`;
  return `<span class="it emo">${item(v.c,v.l)[0]}</span><span class="lv">${v.l}</span>`;

function renderBoard(flash={}){
  if(S.pending.length)placePending();
  let h='';
  for(let i=0;i<N;i++){
    const v=S.board[i];const cls=['cell'];
    if(v&&!v.__reserved){
      if(v.lock===2)cls.push('fog');else{
        if(v.lock===1)cls.push('web');
        if(v.k==='g'){cls.push('gen','lv'+v.lv);if(v.ch<=0)cls.push('empty')}
        if(v.k==='c')cls.push('chest');if(v.k==='j')cls.push('joker');
        if(v.k==='i'&&v.l===chainLen(v.c))cls.push('top');
      }
    }
    if(i===sel)cls.push('sel');if(flash[i])cls.push(flash[i]);
    h+=`<div class="${cls.join(' ')}" data-i="${i}">${cellHtml(v)}</div>`;
  }
  boardEl.innerHTML=h;
  renderOrders();renderInfo();renderHud();checkStuck();
}
function tickGens(){
  const now=Date.now();let changed=false;
  S.board.forEach((v,i)=>{
    if(!v||v.k!=='g')return;const mx=GEN_MAX[v.lv-1],rate=GENS[v.g].rate;
    if(v.ch>=mx){v.t=now;return}
    const n=Math.floor((now-v.t)/rate);
    if(n>0){v.ch=Math.min(mx,v.ch+n);v.t+=n*rate;if(v.ch>=mx)v.t=now;changed=true}
    if(S.scene==='merge'&&!v.lock){const c=boardEl.children[i];if(!c)return;
      c.classList.toggle('empty',v.ch<=0);const chEl=c.querySelector('.ch');if(chEl)chEl.textContent=v.ch;
      let rc=c.querySelector('.rc');
      if(v.ch<mx){if(!rc){c.insertAdjacentHTML('beforeend','<span class="rc"><i></i></span>');rc=c.querySelector('.rc')}rc.firstChild.style.width=Math.min(100,(now-v.t)/rate*100)+'%'}
      else if(rc)rc.remove()}
  });
  if(changed)save();
}
function nearestEmpty(from){
  const fr=Math.floor(from/W),fc=from%W;let best=-1,bd=1e9;
  for(let i=0;i<N;i++){if(S.board[i])continue;const d=Math.abs(Math.floor(i/W)-fr)+Math.abs(i%W-fc)+Math.random()*.1;if(d<bd){bd=d;best=i}}
  return best;
}
function spawnFrom(i,obj,flashCls='spawn'){
  const t=nearestEmpty(i);if(t<0)return -1;
  const a=relRect(boardEl.children[i]),b=relRect(boardEl.children[t]);
  const gh=document.createElement('div');gh.className='ghost';
  gh.style.cssText=`left:${a.x}px;top:${a.y}px;width:${a.w}px;height:${a.h}px;font-size:${a.w*.55}px;transition:transform .22s ease-out`;
  gh.textContent=emojiOf(obj);app.appendChild(gh);
  requestAnimationFrame(()=>gh.style.transform=`translate(${b.x-a.x}px,${b.y-a.y}px)`);
  S.board[t]={__reserved:1};
  setTimeout(()=>{gh.remove();S.board[t]=obj;renderBoard({[t]:flashCls});save()},230);
  return t;
}
function neededChains(){const s=new Set();S.orders.forEach(o=>o.reqs.forEach(q=>{if(q.c)s.add(q.c);else MATS[q.m].r.forEach(([c])=>s.add(c))}));return s}
function produce(i){
  const v=S.board[i],g=GENS[v.g];
  if(v.ch<=0){toast(`${g.name} 충전 중 · 🪙10으로 바로 충전할 수 있어요`);shakeCell(i);return}
  if(nearestEmpty(i)<0){toast('보드가 가득 찼어요! 합치거나 🧳 가방에 넣거나 판매하세요');shakeCell(i);return}
  if(v.ch>=GEN_MAX[v.lv-1])v.t=Date.now();
  v.ch--;S.produced=(S.produced||0)+1;
  const d=GEN_DIST[v.lv-1];let r=Math.random(),l=1;for(let k=0;k<d.length;k++){if(r<d[k]){l=k+1;break}r-=d[k]}
  discover(v.g,l);spawnFrom(i,it(v.g,l));
  const c=boardEl.children[i];if(c){const ch=c.querySelector('.ch');if(ch)ch.textContent=v.ch}
}
function openChest(i){
  const v=S.board[i];
  if(nearestEmpty(i)<0){toast('상자를 열 공간이 없어요');shakeCell(i);return}
  const chains=unlockedChains();const roll=Math.random();const jk=[.06,.12,.2][v.l-1],cn=.18;
  v.n--;
  if(roll<jk)spawnFrom(i,{k:'j',lock:0},'pop');
  else if(roll<jk+cn){const amt=[8,15,30][v.l-1];S.coins+=amt;flyTo('🪙',relRect(boardEl.children[i]),$('pCoin'),4);setTimeout(renderHud,700)}
  else{const c=pick(chains);const l=1+rand(Math.min(chainLen(c)-1,v.l+1));discover(c,l);spawnFrom(i,it(c,l))}
  if(v.n<=0){S.board[i]=null;if(sel===i)sel=-1;setTimeout(()=>{renderBoard();save()},260)}
  else{const c=boardEl.children[i];if(c){const ch=c.querySelector('.ch');if(ch)ch.textContent=v.n}save()}
}
function shakeCell(i){const c=boardEl.children[i];if(!c)return;c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
function discover(c,l){if((S.found[c]||0)<l){const first=S.found[c]!==undefined;S.found[c]=l;if(first&&l>1)setTimeout(()=>toast(`새 아이템 발견: ${item(c,l)[0]} ${item(c,l)[1]}!`),300)}}
function canMerge(A,B){
  if(!A||!B||A.k!==B.k||A.lock||B.__reserved)return false;
  if(A.k==='i')return A.c===B.c&&A.l===B.l&&A.l<chainLen(A.c);
  if(A.k==='g')return A.g===B.g&&A.lv===B.lv&&A.lv<3;
  if(A.k==='c')return A.l===B.l&&A.l<3;
  return false;
}
function mergeResult(A){if(A.k==='i')return it(A.c,A.l+1);if(A.k==='g')return gen(A.g,A.lv+1);return chest(A.l+1)}
function afterMerge(to,flash){
  const r=to/W|0,c=to%W;let revealed=0;
  [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([y,x])=>{if(y<0||y>=H||x<0||x>=W)return;const k=y*W+x,v=S.board[k];if(v&&v.lock===2){v.lock=1;flash[k]='reveal';revealed++}});
  if(revealed){gainXp(revealed);tip('web','안개가 걷히고 덩굴 칸이 드러났어요! 같은 아이템을 끌어 합치면 풀려요')}
  const now=Date.now();combo=now-lastMerge<2500?combo+1:1;lastMerge=now;gainXp(1);
  if(combo>=3){const cell=boardEl.children[to];
    if(cell){const cr=relRect(cell);const d=document.createElement('div');d.className='combo-pop';d.textContent=`콤보 ×${combo}!`;d.style.left=cr.cx+'px';d.style.top=cr.y+'px';app.appendChild(d);setTimeout(()=>d.remove(),1000);
      if(combo%5===0){S.energy+=1;flyTo('⚡',cr,$('pEnergy'),1)}}
    S.coins+=Math.min(5,combo-2)}
}
function drop(from,to){
  if(to<0||to===from){renderBoard();return}
  const A=S.board[from],B=S.board[to];
  if(B&&B.__reserved){renderBoard();return}
  if(!B){S.board[to]=A;S.board[from]=null;sel=to;renderBoard();save();return}
  if(B.lock===2){renderBoard();shakeCell(to);toast('안개 칸이에요. 바로 옆에서 합성하면 안개가 걷혀요');return}
  const flash={};
  if(canMerge(A,B)){
    const res=mergeResult(A);S.board[to]=res;S.board[from]=null;sel=to;
    if(res.k==='i')discover(res.c,res.l);
    if(B.lock===1){flash[to]='reveal';toast('덩굴이 풀렸어요!')}else flash[to]='pop';
    if(res.k==='g')toast(`${GENS[res.g].name} Lv${res.lv}! 충전량과 고급 재료 확률이 올라요`,2800);
    if(res.k==='c')toast(`${CHEST.name[res.l-1]}(으)로 합쳐졌어요`);
    afterMerge(to,flash);renderBoard(flash);save();
    const r=relRect(boardEl.children[to]);burst(r.cx,r.cy,['✨','⭐'],B.lock===1?14:8);return;
  }
  if(A.k==='i'&&B.k==='i'&&A.c===B.c&&A.l===B.l){toast('이미 최고 레벨 아이템이에요');renderBoard();return}
  if(A.k==='j'&&B.k==='i'){
    if(B.l>=chainLen(B.c)){toast('최고 레벨 아이템에는 쓸 수 없어요');renderBoard();return}
    S.board[to]=it(B.c,B.l+1);S.board[from]=null;sel=to;discover(B.c,B.l+1);
    flash[to]=B.lock?'reveal':'pop';afterMerge(to,flash);renderBoard(flash);save();
    const r=relRect(boardEl.children[to]);burst(r.cx,r.cy,['🌈','✨','⭐'],12);toast(`무지개 별로 ${item(B.c,B.l+1)[1]} 완성!`);return;
  }
  const m=recipeOf(A,B);
  if(m&&!B.lock){
    S.board[from]=null;S.board[to]=null;S.inv[m]++;sel=-1;afterMerge(to,flash);renderBoard(flash);
    const r=relRect(boardEl.children[to]);burst(r.cx,r.cy,['💜','✨',MATS[m].e],12);flyTo(MATS[m].e,r,$('invBtn'),1,34);
    toast(`조합 성공! ${MATS[m].e} ${MATS[m].name} → 창고`);gainXp(3);setTimeout(()=>{renderHud();renderOrders()},750);save();return;
  }
  if(B.lock===1){renderBoard();shakeCell(to);toast('덩굴에 묶인 칸은 같은 아이템으로만 풀 수 있어요');return}
  S.board[to]=A;S.board[from]=B;sel=to;renderBoard();save();
}
/* bag */
function toBag(i){
  const v=S.board[i];if(!v||v.lock)return;
  if(v.k==='g'){toast('생산기는 가방에 넣을 수 없어요');renderBoard();return}
  if(S.bag.length>=BAG_MAX){toast('가방이 가득 찼어요');renderBoard();return}
  S.bag.push(v);S.board[i]=null;if(sel===i)sel=-1;renderBoard();save();bump($('bagBtn'));toast(`${nameOf(v)}을(를) 가방에 넣었어요`);
}
function openBag(){
  let h=`<h2 class="title-big">가방</h2><p class="sub">보드가 꽉 찼을 때 아이템을 잠시 보관해요. 누르면 보드로 꺼내요.<br>보드에서 아이템을 가방 버튼으로 끌어다 놓으면 넣을 수 있어요</p><div class="bagg">`;
  for(let k=0;k<BAG_MAX;k++){const v=S.bag[k];h+=v?`<button class="emo" data-act="take:${k}" title="${nameOf(v)}">${emojiOf(v)}</button>`:`<button class="empty" disabled>빈칸</button>`}
  h+=`</div><button class="big-btn ghost" data-act="close">닫기</button>`;
  openSheet(h,false,act=>{
    if(act.startsWith('take:')){const k=+act.slice(5);const t=nearestEmpty(45);if(t<0){toast('보드에 빈칸이 없어요');return}S.board[t]=S.bag.splice(k,1)[0];save();renderBoard({[t]:'spawn'});openBag();return}
    closeSheet();
  });
}
$('bagBtn').onclick=openBag;

/* pointer drag */
let drag=null;
boardEl.addEventListener('pointerdown',e=>{
  resetIdle();
  const c=e.target.closest('.cell');if(!c)return;
  const i=+c.dataset.i,v=S.board[i];
  if(!v||v.__reserved){if(sel>=0){sel=-1;renderBoard()}return}
  drag={i,x:e.clientX,y:e.clientY,moving:false,gh:null,hover:-1,locked:!!v.lock,overBag:false};
  e.preventDefault();
});
window.addEventListener('pointermove',e=>{
  if(!drag||drag.locked)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moving&&Math.hypot(dx,dy)>7){
    drag.moving=true;clearHint();
    const src=boardEl.children[drag.i],r=relRect(src),v=S.board[drag.i];
    const gh=document.createElement('div');gh.className='ghost';
    gh.style.cssText=`left:0;top:0;width:${r.w*1.15}px;height:${r.h*1.15}px;font-size:${r.w*.7}px`;
    gh.textContent=emojiOf(v);app.appendChild(gh);drag.gh=gh;drag.w=r.w*1.15;src.classList.add('src');
    S.board.forEach((o,k)=>{if(k===drag.i||!o||o.lock===2||o.__reserved)return;
      if(canMerge(v,o)||(v.k==='j'&&o.k==='i'&&o.l<chainLen(o.c)))boardEl.children[k].classList.add('match');
      else if(!o.lock&&recipeOf(v,o))boardEl.children[k].classList.add('combo')});
  }
  if(drag.moving){
    const a=app.getBoundingClientRect();
    drag.gh.style.transform=`translate(${e.clientX-a.left-drag.w/2}px,${e.clientY-a.top-drag.w*.8}px)`;
    const br=$('bagBtn').getBoundingClientRect();const ob=e.clientX>=br.left&&e.clientX<=br.right&&e.clientY>=br.top&&e.clientY<=br.bottom;
    if(ob!==drag.overBag){drag.overBag=ob;$('bagBtn').classList.toggle('hover',ob)}
    const t=document.elementFromPoint(e.clientX,e.clientY);const c=t&&t.closest&&t.closest('.cell');
    const hi=c?+c.dataset.i:-1;
    if(hi!==drag.hover){if(drag.hover>=0)boardEl.children[drag.hover]?.classList.remove('hover');if(hi>=0&&hi!==drag.i)c.classList.add('hover');drag.hover=hi}
  }
});
window.addEventListener('pointerup',()=>{
  if(!drag)return;const d=drag;drag=null;$('bagBtn').classList.remove('hover');
  if(d.moving){d.gh.remove();if(d.overBag)toBag(d.i);else drop(d.i,d.hover)}
  else tap(d.i);
});
window.addEventListener('pointercancel',()=>{if(drag){drag.gh&&drag.gh.remove();drag=null;renderBoard()}});
function tap(i){
  const v=S.board[i];const was=sel;sel=i;clearHint();
  if(v&&!v.lock&&v.k==='g'){renderBoard();produce(i);return}
  if(v&&!v.lock&&v.k==='c'){renderBoard();openChest(i);return}
  if(was!==i)renderBoard();
}

/* ---------- hints & anti-stall ---------- */
let hintEls=[],idleT=null,lastRescue=0,lastFullTip=0;
function clearHint(){hintEls.forEach(e=>e.remove());hintEls=[];document.querySelectorAll('.cell.hint,.order.hint').forEach(e=>e.classList.remove('hint'));$('hintBtn').classList.remove('glow')}
function resetIdle(){clearTimeout(idleT);idleT=setTimeout(()=>{if(S.scene==='merge'&&!drag&&!$('shade').classList.contains('on'))showHint(false)},S.level<=2?5000:9000)}
function findMove(){
  const B=S.board,open=i=>B[i]&&!B[i].lock&&!B[i].__reserved,cnt=countOnBoard();
  const oi=S.orders.findIndex(o=>orderReady(o,cnt));if(oi>=0)return {type:'order',i:oi};
  const need=neededChains();let best=null,bs=-1;
  for(let a=0;a<N;a++){if(!open(a))continue;for(let b=0;b<N;b++){if(a===b)continue;const o=B[b];if(!o||o.lock===2||o.__reserved)continue;
    if(canMerge(B[a],o)){let s=2;if(o.lock===1)s=4;if(B[a].k==='i'&&need.has(B[a].c))s+=1;if(B[a].k==='g')s+=2;if(s>bs){bs=s;best={type:'merge',a,b}}}
    else if(!o.lock&&recipeOf(B[a],o)&&bs<3){bs=3;best={type:'recipe',a,b}}}}
  if(best)return best;
  const empty=B.some(v=>!v);
  if(empty){const ci=B.findIndex((v,i)=>open(i)&&v.k==='c');if(ci>=0)return {type:'tap',i:ci,msg:'상자를 눌러 열어 보세요'};
    const gens=B.map((v,i)=>i).filter(i=>open(i)&&B[i].k==='g'&&B[i].ch>0);
    if(gens.length){const g=gens.find(i=>need.has(B[i].g))??gens[0];return {type:'tap',i:g,msg:`${GENS[B[g].g].name}을(를) 눌러 재료를 만들어요`}}
    if(S.bag.length)return {type:'bag'};
    return {type:'wait'};
  }
  let low=-1,ll=99;B.forEach((v,i)=>{if(open(i)&&v.k==='i'&&v.l<ll){ll=v.l;low=i}});
  return {type:'full',i:low};
}
function fingerAt(el,dragTo){
  const f=document.createElement('div');f.className='finger';f.textContent='👆';app.appendChild(f);hintEls.push(f);
  const a=relRect(el);const A=`translate(${a.cx-12}px,${a.cy-6}px)`;
  if(dragTo){const b=relRect(dragTo);const Bt=`translate(${b.cx-12}px,${b.cy-6}px)`;f.animate([{transform:A,opacity:0},{transform:A,opacity:1,offset:.15},{transform:Bt,opacity:1,offset:.75},{transform:Bt,opacity:0}],{duration:1500,iterations:3,easing:'ease-in-out'})}
  else f.animate([{transform:A+' scale(1)'},{transform:A+' scale(.8)'},{transform:A+' scale(1)'}],{duration:700,iterations:4});
  setTimeout(()=>{f.remove()},4600);
}
function showHint(manual){
  clearHint();const m=findMove();const cells=boardEl.children;
  if(m.type==='order'){$('orders').children[m.i]?.classList.add('hint');if(manual)toast('주문을 완료할 수 있어요! 완료 버튼을 누르세요')}
  else if(m.type==='merge'||m.type==='recipe'){cells[m.a].classList.add('hint');cells[m.b].classList.add('hint');fingerAt(cells[m.a],cells[m.b]);
    if(manual||autoTip())toast(m.type==='recipe'?'서로 다른 두 아이템을 겹쳐 자재를 만들어요':S.board[m.b].lock===1?'같은 아이템을 덩굴 칸에 겹쳐 풀어 보세요':'같은 아이템끼리 끌어서 겹쳐 보세요')}
  else if(m.type==='tap'){cells[m.i].classList.add('hint');fingerAt(cells[m.i]);if(manual||autoTip())toast(m.msg)}
  else if(m.type==='bag'){fingerAt($('bagBtn'));if(manual)toast('가방에 보관한 아이템을 꺼내 보세요')}
  else if(m.type==='wait'){if(manual)toast('생산기가 충전 중이에요. 잠시 기다리거나 🪙10으로 충전하세요')}
  else if(m.type==='full'){if(m.i>=0){sel=m.i;renderBoard();cells[m.i].classList.add('hint')}toast('보드가 가득 찼어요. 낮은 단계 아이템을 판매하거나 🧳 가방에 넣어 보세요',3200)}
  resetIdle();
}
function autoTip(){if(S.level>1)return false;S.tips.autoN=(S.tips.autoN||0)+1;return S.tips.autoN<=4}
function checkStuck(){
  if(S.scene!=='merge')return;const m=findMove();
  if(m.type==='wait'){const anyEmptyGen=S.board.some(v=>v&&v.k==='g'&&!v.lock&&v.ch<=0);
    if(anyEmptyGen&&Date.now()-lastRescue>45000){lastRescue=Date.now();S.board.forEach(v=>{if(v&&v.k==='g'&&!v.lock){v.ch=GEN_MAX[v.lv-1];v.t=Date.now()}});save();setTimeout(()=>{renderBoard();toast('막힘 방지: 생산기를 모두 무료로 충전했어요 ⚡')},300)}}
  if(m.type==='full'&&Date.now()-lastFullTip>20000){lastFullTip=Date.now();$('hintBtn').classList.add('glow')}
}
$('hintBtn').onclick=()=>showHint(true);

/* orders */
function countOnBoard(){const m={};S.board.forEach(v=>{if(v&&v.k==='i'&&!v.lock){const k=v.c+v.l;m[k]=(m[k]||0)+1}});return m}
function needMap(o){const n={};o.reqs.forEach(q=>{const k=q.m?'m:'+q.m:q.c+q.l;n[k]=(n[k]||0)+1});return n}
function orderReady(o,cnt){const n=needMap(o);return Object.keys(n).every(k=>(k.startsWith('m:')?S.inv[k.slice(2)]:(cnt[k]||0))>=n[k])}
function ensureOrders(){
  const want=orderSlots();while(S.orders.length<want)S.orders.push(genOrder(S.orders.length));
  const now=Date.now();S.orders.forEach((o,i)=>{if(o.ex&&now>o.ex){S.orders[i]=genOrder(i,true);toast(`${VILLAGERS[o.who][1]}의 특급 주문이 만료됐어요`)}});
}
function renderOrders(){
  ensureOrders();const cnt=countOnBoard();let h='',ready=0;
  S.orders.forEach((o,idx)=>{
    const r=orderReady(o,cnt);if(r)ready++;const used={};
    const reqs=o.reqs.map(q=>{
      if(q.m){const k='m:'+q.m;used[k]=(used[k]||0)+1;const hv=S.inv[q.m]>=used[k];return `<span class="req mat emo ${hv?'have':''}" title="${MATS[q.m].name} 자재 (창고 ${S.inv[q.m]}개)">${MATS[q.m].e}</span>`}
      const k=q.c+q.l;used[k]=(used[k]||0)+1;const hv=(cnt[k]||0)>=used[k];
      return `<span class="req emo ${hv?'have':''}" title="${item(q.c,q.l)[1]} (${CHAINS[q.c].name} Lv${q.l})">${item(q.c,q.l)[0]}</span>`}).join('');
    const [ve,vn]=VILLAGERS[o.who%VILLAGERS.length];const left=o.ex?Math.max(0,Math.ceil((o.ex-Date.now())/1000)):0;
    h+=`<div class="order ${r?'ready':''} ${o.ex?'express':''}" data-o="${idx}"><span class="who emo">${ve}</span><button class="sw" data-sw="${idx}" aria-label="다른 주문으로 바꾸기">↻</button>${o.ex?`<span class="tmr" data-ex="${idx}">⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</span>`:`<span class="name">${vn}</span>`}<div class="reqs">${reqs}</div><div class="rw"><span class="emo">⚡</span>${o.energy} <span class="emo">🪙</span>${o.coins}${o.chest?` <span class="emo">${CHEST.emo[o.chest-1]}</span>`:''}</div><button class="ok" data-o="${idx}">${r?'완료!':o.ex?'특급 주문':'준비 중'}</button></div>`;
  });
  $('orders').innerHTML=h;$('readyDot').hidden=!ready;$('readyDot').textContent=ready;
}
$('orders').addEventListener('click',e=>{
  resetIdle();
  const sw=e.target.closest('[data-sw]');if(sw){swapOrder(+sw.dataset.sw);return}
  const rq=e.target.closest('.req');if(rq){toast(rq.title);return}
  const b=e.target.closest('button.ok');if(b)completeOrder(+b.dataset.o);
});
function swapOrder(i){
  const cost=S.level<=2?0:5;if(S.coins<cost){toast('코인이 부족해요');return}
  S.coins-=cost;S.orders[i]=genOrder(i,true);save();renderBoard();toast(cost?`주문을 바꿨어요 (🪙${cost})`:'주문을 바꿨어요');
}
function completeOrder(idx){
  const o=S.orders[idx];if(!o||!orderReady(o,countOnBoard()))return;
  const card=$('orders').children[idx],from=relRect(card);
  o.reqs.forEach(q=>{if(q.m){S.inv[q.m]--;return}
    const hits=[];S.board.forEach((v,i)=>{if(v&&v.k==='i'&&!v.lock&&v.c===q.c&&v.l===q.l)hits.push(i)});
    const best=hits.find(i=>i!==sel)??hits[0]??-1;if(best>=0){S.board[best]=null;if(best===sel)sel=-1}});
  S.energy+=o.energy;S.coins+=o.coins;gainXp(o.xp);if(o.chest)S.pending.push(chest(o.chest));
  flyTo('⚡',from,$('pEnergy'),Math.min(8,o.energy));flyTo('🪙',from,$('pCoin'),4,22);setTimeout(renderHud,750);
  card.classList.add('leaving');S.orders[idx]=genOrder(idx);save();
  setTimeout(()=>{renderBoard();renderGoal()},300);
  if(o.ex)toast('특급 주문 완료! 보상 2배 🎉');
  if(!S.tips.firstOrder){S.tips.firstOrder=1;setTimeout(()=>toast('⚡ 에너지를 모았어요! 🏘️ 마을로 가서 건물을 지어 보세요',3500),900)}
}
function genOrder(slot,noEx){
  const chains=unlockedChains(),lv=S.level;const maxL=2+Math.floor(lv/2);
  const n=lv<2?1:lv<4?(Math.random()<.55?1:2):(Math.random()<.35?1:Math.random()<.7?2:3);
  const reqs=[];
  for(let k=0;k<n;k++){
    if(k===0&&lv>=3&&Math.random()<.22){const mats=MAT_IDS.filter(matAvailable);reqs.push({m:pick(mats)});continue}
    const c=pick(chains);const cap=Math.min(maxL,chainLen(c)-1);let l=2+Math.floor(Math.pow(Math.random(),.9)*(cap-1));if(n>1)l=Math.max(2,l-1);reqs.push({c,l});
  }
  const usedWho=S.orders.filter((_,i)=>i!==slot).map(o=>o.who);let who;do{who=rand(VILLAGERS.length)}while(usedWho.includes(who));
  const ex=!noEx&&lv>=2&&Math.random()<.18&&!S.orders.some((o,i)=>i!==slot&&o.ex);
  const o=mkOrder(reqs,who,ex);if(!ex&&lv>=2&&Math.random()<.25)o.chest=1;return o;
}
function placePending(){
  while(S.pending.length){const t=nearestEmpty(45);if(t<0){tip('full','보드가 가득 차서 보상이 대기 중이에요. 공간을 비워 주세요');break}S.board[t]=S.pending.shift()}
  save();
}

function setScene(s){
  S.scene=s;save();clearHint();
  $('map').classList.toggle('off',s!=='map');$('merge').classList.toggle('off',s!=='merge');
  $('toMerge').hidden=s!=='map';$('goal').hidden=s!=='map';$('zoombar').hidden=s!=='map';$('toMap').hidden=s!=='merge';
  $('hintBtn').hidden=s!=='merge';$('dexBtn').hidden=s!=='merge';$('gear').hidden=s==='merge';
  if(s==='merge'){renderBoard();sizeBoard();requestAnimationFrame(sizeBoard);resetIdle();if(!S.tips.firstHint){S.tips.firstHint=1;save();setTimeout(()=>showHint(true),700)}}
  else{syncWorld();resize3D()}
}
$('toMerge').querySelector('button').onclick=()=>setScene('merge');
$('toMap').querySelector('button').onclick=()=>setScene('map');

$('invBtn').onclick=()=>{

  let h=`<h2 class="title-big">창고 & 레시피</h2><p class="sub">합성 보드에서 서로 다른 두 아이템을 겹치면 자재가 돼요</p><div class="inv">`;
  MAT_IDS.forEach(m=>{const M=MATS[m];const ok=M.r.every(([c])=>u.includes(c));
    const rec=M.r.map(([c,l])=>(S.found[c]||0)>=l?`<span class="emo">${item(c,l)[0]}</span> ${item(c,l)[1]}`:`<span class="emo">❔</span> ${CHAINS[c].name} ${l}단계`).join(' + ');
    h+=`<div class="row ${ok?'':'lockd'}"><span class="ie emo">${M.e}</span><div class="nm">${M.name}<span>${ok?rec:'🔒 '+M.r.filter(([c])=>!u.includes(c)).map(([c])=>CHAINS[c].name).join(', ')+' 생산기 필요'}</span></div><span class="cnt">${S.inv[m]||0}</span></div>`});
  h+=`</div><button class="big-btn ghost" data-act="close">닫기</button>`;openSheet(h,false,()=>closeSheet());
};
$('dexBtn').onclick=()=>{
  const u=unlockedChains();const total=CHAIN_IDS.reduce((s,c)=>s+chainLen(c),0),got=CHAIN_IDS.reduce((s,c)=>s+(S.found[c]||0),0);
  let h=`<h2 class="title-big">아이템 도감</h2><p class="sub">발견한 아이템 ${got}/${total} · 8개 계열</p><div class="dex">`;
  CHAIN_IDS.forEach(c=>{const ok=u.includes(c);h+=`<div class="row ${ok?'':'lockd'}"><b>${ok?'':'🔒'}${CHAINS[c].name}</b>${CHAINS[c].items.map((x,k)=>k<(S.found[c]||0)?`<span class="emo" title="${x[1]}">${x[0]}</span>`:`<span class="unk">?</span>`).join('')}</div>`});
  h+=`</div><button class="big-btn ghost" data-act="close">닫기</button>`;openSheet(h,false,()=>closeSheet());
};
function showIntro(){
  openSheet(`<h2 class="title-big">햇살 마을에 오신 걸 환영해요</h2><p class="sub">작은 섬을 사랑스러운 마을로 꾸며 보세요</p>
  <ul class="steps">
    <li><span class="emo">🧺</span><span><b>생산기</b>를 눌러 재료를 만들고, 같은 것끼리 겹쳐 <b>상위 아이템</b>으로 합성해요 (8계열 64종)</span></li>
    <li><span class="emo">🌿</span><span>☁️ 안개와 덩굴 칸을 풀면 숨은 <b>생산기·보물 상자·무지개 별</b>을 얻어요</span></li>
    <li><span class="emo">⚙️</span><span>서로 다른 두 아이템을 겹치면 <b>건축 자재</b>가 돼요 (📦 레시피)</span></li>
    <li><span class="emo">💡</span><span>막히면 <b>힌트</b>, 보드가 꽉 차면 <b>🧳 가방</b>, 어려운 주문은 <b>↻</b>로 바꿔요</span></li>
    <li><span class="emo">🏛️</span><span>⚡에너지와 자재로 3D 섬에 <b>랜드마크</b>를 짓고, <b>빈 땅(+)</b>에 집·공원·장터를 세워요</span></li>
    <li><span class="emo">🌤️</span><span>랜드마크 완공 + 매력도를 채우면 다음 지역의 <b>구름</b>이 걷혀요</span></li>
  </ul>
  <button class="big-btn" data-act="start">시작하기</button>`,true,()=>{S.intro=true;save();closeSheet();toast('지도를 끌어서 둘러보고, ⚡5로 마을 회관 첫 단계를 지어 보세요!',3500)});
}
$('gear').onclick=()=>{
  const tl={auto:'자동 (기기 시간)',day:'항상 낮',night:'항상 밤'};
  openSheet(`<h2 class="title-big">설정</h2><p class="sub">레벨 ${S.level} · 랜드마크 ${LANDMARKS.filter(lmDone).length}/${LANDMARKS.length} · 건물 ${Object.keys(S.lots).length}채</p>
  <button class="big-btn blue" data-act="time"><span class="emo">${isNight()?'🌙':'☀️'}</span> 시간대: ${tl[S.time]}</button>
  <button class="big-btn blue" data-act="help">게임 방법 보기</button>
  <button class="big-btn red" data-act="reset">처음부터 다시 하기</button>
  <button class="big-btn ghost" data-act="close">닫기</button>`,true,act=>{
    if(act==='time'){S.time={auto:'day',day:'night',night:'auto'}[S.time];save();applyTime();$('gear').onclick()}
    else if(act==='help')showIntro();
    else if(act==='reset')openSheet(`<h2 class="title-big">정말 초기화할까요?</h2><p class="sub">마을과 보드의 모든 진행 상황이 사라져요</p><button class="big-btn red" data-act="yes">초기화</button><button class="big-btn ghost" data-act="close">취소</button>`,true,a=>{
      if(a==='yes'){S=fresh();sel=-1;save();closeSheet();setScene('map');renderHud();if(V){flyCam(ZONES[0].c[0],ZONES[0].c[1]-2,1)}setTimeout(showIntro,300)}else closeSheet()});
    else closeSheet();
  });
};

let readySig='';
function start(){
  S=load();
  renderHud();
  try{init3D()}catch(err){console.error(err);$('stage').innerHTML='<div class="loading">3D를 표시할 수 없는 환경이에요</div>'}
  setScene(S.scene||'map');
  window.addEventListener('resize',()=>{if(S.scene==='merge')sizeBoard()});
  if(window.ResizeObserver){new ResizeObserver(()=>{if(S.scene==='merge')sizeBoard()}).observe($('boardwrap'));new ResizeObserver(()=>resize3D()).observe($('stage'))}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(S.scene==='merge')sizeBoard()});
  setInterval(()=>{tickGens();
    if(S.scene==='merge'){const v=S.board[sel];if(v&&v.k==='g'&&!v.lock){const t=$('info').querySelector('[data-gen]');if(t){const mx=GEN_MAX[v.lv-1];t.textContent=`충전 ${v.ch}/${mx}${v.ch>=mx?'':` · ${Math.max(1,Math.ceil((GENS[v.g].rate-(Date.now()-v.t))/1000))}초 후 +1`}`}}}},250);
  setInterval(()=>{
    if(S.scene==='merge'){let expired=false;
      S.orders.forEach((o,i)=>{if(!o.ex)return;const left=Math.max(0,Math.ceil((o.ex-Date.now())/1000));if(left<=0)expired=true;const el=document.querySelector(`[data-ex="${i}"]`);if(el)el.textContent=`⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`});
      if(expired){renderOrders();save()}}
    else if(V&&!$('shade').classList.contains('on')){
      const sig=Object.entries(S.lots).filter(([,L])=>LOTS[L.type].sec&&Date.now()>=L.next).map(([k])=>k).join(',')+'|'+isNight();
      if(sig!==readySig){readySig=sig;applyTime();buildLabels();renderGoal()}}
  },1000);
  if(!S.intro)setTimeout(showIntro,500);
}
start();
</script>

  document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
    let hadController=!!navigator.serviceWorker.controller,reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController&&!reloaded){reloaded=true;try{toast('새 버전으로 업데이트했어요')}catch(e){}setTimeout(()=>location.reload(),900)}hadController=true});
    window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

  if(ios&&!standalone&&!dismissed){

  }
})();
